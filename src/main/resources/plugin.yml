name: CrystalCore
version: 1.7.0
main: com.crystalville.crystalcore.CrystalCore
api-version: '1.20'
author: Divyansh7577
description: Crystal Ville core plugin with economy, ranks, shop, stats and utilities.

commands:
  crystal:
    description: Manage Crystal economy.
    usage: /crystal
    permission: crystalcore.crystal

  shop:
    description: Open the Crystal Ville shop.
    usage: /shop
    permission: crystalcore.shop

  pay:
    description: Pay another player.
    usage: /pay <player> <amount>
    permission: crystalcore.pay

  balance:
    description: Check your Crystal balance.
    usage: /balance
    aliases: [bal]
    permission: crystalcore.balance

  withdraw:
    description: Withdraw Crystal from your balance.
    usage: /withdraw <amount>
    permission: crystalcore.withdraw

  mail:
    description: Open your Crystal Ville mailbox.
    usage: /mail
    permission: crystalcore.mail

  rank:
    description: Check your rank.
    usage: /rank
    permission: crystalcore.rank

  stats:
    description: Check player statistics.
    usage: /stats [player]
    permission: crystalcore.stats

  admin:
    description: CrystalCore admin commands.
    usage: /admin
    permission: crystalcore.admin

  afk:
    description: Toggle AFK mode.
    usage: /afk
    permission: crystalcore.afk

  inspect:
    description: Inspect blocks and containers.
    usage: /inspect
    permission: crystalcore.inspect

  hole:
    description: Fill holes around you.
    usage: /hole
    permission: crystalcore.hole

  link:
    description: Link your Minecraft account with Discord.
    usage: /link <code>
    permission: crystalcore.link

  cvlink:
    description: Link your Minecraft account to the Crystal Ville website Player Hub.
    usage: /cvlink <6-digit-code>
    permission: crystalcore.cvlink
    permission-message: "&cYou don't have permission to use /cvlink."

permissions:
  crystalcore.crystal:
    default: true

  crystalcore.shop:
    default: true

  crystalcore.pay:
    default: true

  crystalcore.balance:
    default: true

  crystalcore.withdraw:
    default: true

  crystalcore.mail:
    default: true

  crystalcore.rank:
    default: true

  crystalcore.stats:
    default: true

  crystalcore.admin:
    default: op

  crystalcore.afk:
    default: true

  crystalcore.inspect:
    default: true

  crystalcore.hole:
    default: true

  crystalcore.link:
    default: true

  crystalcore.cvlink:
    default: true
