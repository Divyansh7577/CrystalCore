name: CrystalCore
version: 1.11.0
main: com.crystalville.crystalcore.CrystalCore
api-version: '1.20'
author: Divyansh7577
description: Core plugin for Crystal Ville SMP - Crystal economy, personal and Enterprise banking, shop, roles, anti-theft chest logging, hole filler, HUD, and 3D Logo holograms.

commands:
  pay:
    description: Pay another player using Crystals (works online or offline).
    usage: /pay <player> <amount>
    permission: crystalcore.pay
    permission-message: "&cYou don't have permission to use /pay."
  buy:
    description: Buy items from the shop (Market Minister only) or check prices.
    usage: /buy <item> <quantity>  |  /buy info <item>
    permission: crystalcore.buy
    permission-message: "&cYou don't have permission to use /buy."
  sell:
    description: Sell items to the shop for Crystals, check sell prices, or use the visual sell menu.
    usage: /sell <item> <quantity>  |  /sell info <item>  |  /sell gui
    permission: crystalcore.sell
    permission-message: "&cYou don't have permission to use /sell."
  rank:
    description: Set a player's custom rank name and color. OP only.
    usage: /rank <player> <rankname> <colour>
    permission: crystalcore.rank
    permission-message: "&cOnly OPs can use /rank."
  role:
    description: Assign a pre-built role (Market Minister, Finance Minister) to a player. OP only.
    usage: /role <player> <role name>
    permission: crystalcore.role
    permission-message: "&cOnly OPs can use /role."
  logo:
    description: Spawn or remove a 3D floating text logo. OP only.
    usage: /logo <text...> | /logo remove
    permission: crystalcore.logo
    permission-message: "&cOnly OPs can use /logo."
  claim:
    description: Claim pending Crystals from a payment that couldn't fit in your inventory.
    usage: /claim <amount>
    permission: crystalcore.claim
    permission-message: "&cYou don't have permission to use /claim."
  draft:
    description: Check how many Crystals are waiting in your draft (pending balance).
    usage: /draft info
    permission: crystalcore.draft
    permission-message: "&cYou don't have permission to use /draft."
  i:
    description: Toggle Chest Inspector Mode (anti-theft chest logging). OP only.
    usage: /i
    permission: crystalcore.inspect
    permission-message: "&cOnly OPs can use /i."
  holefiller:
    description: Toggle Hole Filler Mode. OP only.
    usage: /holefiller [on|off|material]
    permission: crystalcore.holefiller
    permission-message: "&cYou don't have permission to use /holefiller."
  inventory:
    description: View or clear a player's inventory. OP only.
    usage: /inventory <player>  |  /inventory clear <player>
    permission: crystalcore.inventory
    permission-message: "&cYou don't have permission to use /inventory."
  shop:
    description: Add or update a shop item's price. OP and Market Minister only.
    usage: /shop add <item name> <price>
    permission: crystalcore.shop
    permission-message: "&cYou don't have permission to use /shop."
  hud:
    description: Toggle your Crystal Ville HUD, or get the HUD Toggle item.
    usage: /hud  |  /hud item
    permission: crystalcore.hud
    permission-message: "&cYou don't have permission to use /hud."
  edit:
    description: Edit your own HUD footer text.
    usage: /edit <text>
    permission: crystalcore.edit
    permission-message: "&cYou don't have permission to use /edit."
  cvlink:
    description: Link your Minecraft account to the Crystal Ville website Player Hub.
    usage: /cvlink <6-digit-code>
    permission: crystalcore.cvlink
    permission-message: "&cYou don't have permission to use /cvlink."
  bank:
    description: Manage your personal Crystal Bank (default cap 10,000, raisable via /increase limit; unlimited for Finance Minister/OP).
    usage: /bank balance | /bank add <amount> | /bank withdraw <amount> | /bank gui
    permission: crystalcore.bank
    permission-message: "&cYou don't have permission to use /bank."
  enterprise:
    description: Create and manage an Enterprise Bank account for your company, including a visual GUI.
    usage: /enterprise create|info|balance|deposit|withdraw|gui|add|remove|setperms|members|history|list|increase
    permission: crystalcore.enterprise
    permission-message: "&cYou don't have permission to use /enterprise."
  payenterprise:
    description: Pay an Enterprise Bank directly using its Enterprise ID (UPI-style, instant).
    usage: /payenterprise <EnterpriseID> <amount>
    permission: crystalcore.payenterprise
    permission-message: "&cYou don't have permission to use /payenterprise."
  increase:
    description: Raise a player's personal Crystal Bank limit. OP and Finance Minister only.
    usage: /increase limit <player> <new limit>
    permission: crystalcore.increase
    permission-message: "&cYou don't have permission to use /increase."
  issue:
    description: Reissue an Enterprise Handbook. Enterprise owner and OP only.
    usage: /issue guide <EnterpriseID>
    permission: crystalcore.issue
    permission-message: "&cYou don't have permission to use /issue."

permissions:
  crystalcore.pay:
    default: true
  crystalcore.buy:
    default: true
  crystalcore.sell:
    default: true
  crystalcore.rank:
    default: op
  crystalcore.role:
    default: op
  crystalcore.logo:
    default: op
  crystalcore.claim:
    default: true
  crystalcore.draft:
    default: true
  crystalcore.inspect:
    default: op
  crystalcore.holefiller:
    default: op
  crystalcore.inventory:
    default: op
  crystalcore.shop:
    default: true
  crystalcore.hud:
    default: true
  crystalcore.edit:
    default: true
  crystalcore.cvlink:
    default: true
  crystalcore.bank:
    default: true
  crystalcore.enterprise:
    default: true
  crystalcore.payenterprise:
    default: true
  crystalcore.increase:
    default: true
  crystalcore.issue:
    default: true
